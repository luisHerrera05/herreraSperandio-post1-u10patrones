# ---------------------------------------------------------------
# Configuracion de SonarQube para envios-service
# (Con Maven, estas mismas propiedades estan duplicadas en el pom.xml,
#  porque sonar-maven-plugin no lee este archivo; se conserva aqui como
#  documentacion y para usar con sonar-scanner CLI.)
# ---------------------------------------------------------------

# Identificacion del proyecto en SonarQube
sonar.projectKey=com.universidad:envios-service
sonar.projectName=Envios Service
sonar.projectVersion=1.0

# Codigo fuente y pruebas
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes

# Reporte de cobertura generado por JaCoCo (mvn clean verify)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Servidor: local con Docker. Para SonarCloud usar https://sonarcloud.io
# y agregar sonar.organization=<tu-organizacion>
sonar.host.url=http://localhost:9000

# No esperar el resultado del Quality Gate al terminar el analisis
sonar.qualitygate.wait=false

# Exclusiones (Decision de diseno 2): no se excluye nada; todo el codigo
# es logica de negocio y no existe clase Main.
# sonar.exclusions=
